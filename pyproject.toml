[project]
name = "fabrica-negocios"
version = "0.1.0"
description = "Controlador local de experimentos com Codex e avaliação financeira verificável"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fabrica = "fabrica.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabrica*"]

[tool.setuptools.package-data]
fabrica = ["opportunities.json"]
